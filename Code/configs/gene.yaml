seed: 42
device: auto
cpu_threads: 4
dataset: official_deepruot_simulation_gene
data_path: data/simulation_gene_data.csv
dimension: 2
model_times: [0, 1, 2, 3, 4]
model_sigma: 0.25
growth_penalty: 10.0
growth_penalty_type: quadratic_half
control_mode: quadratic_minimal
max_observed_points: null
pair:
  ratio_min: 0.1
  ratio_max: 10.0
  coverage_epochs: 10
  conditions_per_batch: 512
  times_per_condition: 4
  hidden_width: 128
  hidden_layers: 3
  correction_bounds: [4.0, 4.0, 4.0]
  delta_scale: 1.0
  learning_rate: 0.001
  dtype: float64
  quadrature_nodes: 32
  max_quadrature_nodes: 128
  query_atol: 0.0001
  query_rtol: 0.0001
  validation_conditions: 128
  validation_every: 1
coupling:
  algorithm: row_normalization_column_root
  entropy_coefficient: sigma_squared
  reference_weights: ones
  marginal_tolerance: 0.000001
  root_logmass_tolerance: 0.00000001
  max_outer_iterations: 1000
  max_bisection_iterations: 60
  mode: full
  minibatch_size_hint: 256
  partition_seed: 43
  ratio_grid_nodes: 65
  max_ratio_grid_nodes: 257
  table_atol: 0.001
  table_rtol: 0.001
  curvature_tolerance: 0.00001
  condition_chunk: 512
matching:
  hidden_width: 128
  hidden_layers: 3
  batch_size: 2048
  learning_rate: 0.001
  steps: 50000
  dtype: float32
  interval_sampling: uniform
  log_every: 100
generation:
  n_particles: 2000
  steps_per_unit_interval: 200
  endpoint_guard: 0.00001
  particle_birth_death: false
  carry_log_weights: true
  sensitivity_particles: 256
evaluation:
  library: POT
  transport_solver: emd2
  normalize_for_W1_W2: true
  report_mass_separately: true
