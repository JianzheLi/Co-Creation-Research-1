# Experiment 2 only: retry Weinreb with a global four-worker block queue and
# a bounded, meaningful nonmonotone fallback for line-search stalls.
extends: experiment2_weinreb_ours_sigma05.yaml
coupling:
  marginal_tolerance: 0.002
  stationarity_tolerance: 0.003
  projection_tolerance: 0.00005
  parallel_workers: 4
  global_block_queue: true
  allow_nonmonotone_fallback: true
  nonmonotone_min_step_fraction: 0.000244140625
